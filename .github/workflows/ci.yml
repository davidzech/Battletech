name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it makes stale; main keeps every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: battletech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/battletech_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Test
        run: go test ./...
      # The site as it runs once MekBay's release is version 2: every force written in version 2, hangars converted when changed.
      - name: Test (MekBay version 2)
        run: MEKBAY_TEST_V2=1 go test ./internal/site

  browser:
    # The Playwright suite in browsertests/, driving the browser scripts against the site served with the fake MekBay (TestBrowser in internal/site).
    # It runs alongside the go job rather than after it, so a run takes as long as its slowest job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: browsertests/package-lock.json
      - name: Install packages
        working-directory: browsertests
        run: npm ci
      # Chromium is cached by the lockfile (it pins the Playwright version); only its system libraries are installed on a hit.
      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('browsertests/package-lock.json') }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: browsertests
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: browsertests
        run: npx playwright install-deps chromium
      - name: Browser tests
        run: BROWSER_TESTS=1 go test ./internal/site -run '^TestBrowser$' -count=1 -v
      - name: Browser tests (MekBay version 2)
        run: BROWSER_TESTS=1 MEKBAY_TEST_V2=1 go test ./internal/site -run '^TestBrowser$' -count=1 -v
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: browsertests/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Layers (the base images, go mod download) are cached in the Actions cache between runs.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: battletech
          cache-from: type=gha
          cache-to: type=gha,mode=max
