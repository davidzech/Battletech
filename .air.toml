#:schema https://json.schemastore.org/any.json

# Live reload for development: `air` from the repo root rebuilds and restarts the site whenever Go code or an
# embedded file (templates, CSS, JS, JSON) changes. Campaign Markdown is read on every request, so campaigns/ is
# not watched. Install with `go install github.com/air-verse/air@v1.67.4`.
#
# Air's browser-reload proxy is deliberately off: it forwards with Host set to the app's port, so the site's
# same-origin check refuses every POST, and it drops WebSocket upgrades, which the MekBay relay needs. The site
# reloads open pages itself instead: -dev-reload (internal/site/devreload.go).

root = "."
tmp_dir = "tmp"

[build]
  # .exe on every platform: Windows needs it to run the binary, and macOS and Linux don't mind it.
  cmd = "go build -o ./tmp/battletech.exe ."
  entrypoint = ["./tmp/battletech.exe"]
  # The binary isn't in a go-build temp folder, so say localhost explicitly (no firewall prompt on Windows). -mekbay-next: development runs against
  # MekBay's next release (version 2 forces); `air -- -mekbay-next=false` runs against mekbay.com instead (a later flag wins).
  args_bin = ["-addr", "localhost:8080", "-dev-reload", "-mekbay-next"]
  include_ext = ["go", "html", "css", "js", "json"]
  exclude_dir = ["tmp", "campaigns", "data", "Pages", "node_modules", ".git", ".github"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true
  log = "build-errors.log"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
